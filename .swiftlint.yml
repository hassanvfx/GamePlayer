included:
  - GamePlayer
  - GamePlayerTests
  - GamePlayerUITests
disabled_rules:
  - trailing_whitespace
  - force_unwrapping
  - function_body_length
  - identifier_name
  - implicit_optional_initialization
  - multiple_closures_with_trailing_closure
  - nesting
  - opening_brace
  - static_over_final_class
  - type_body_length
opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - sorted_first_last
line_length:
  warning: 120
  error: 160
type_name:
  min_length: 3
  max_length: 60
file_length:
  warning: 500
  error: 500
reporter: xcode
